name: Build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Set up Java 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build
        run: |
          set +e
          ./gradlew build --stacktrace > build.log 2>&1
          code=$?
          cat build.log
          if [ "$code" -ne 0 ]; then
            # scoate erorile de compilare ca adnotare, ca sa se vada direct in Actions
            MSG=$(grep -E "error:|\.java:[0-9]+|symbol:|location:|What went wrong|Execution failed|Caused by" -A1 build.log | head -80 | sed ':a;N;$!ba;s/%/%25/g;s/\r//g;s/\n/%0A/g')
            echo "::error title=Gradle build failed::${MSG}"
          fi
          exit $code

      - name: Upload jar
        uses: actions/upload-artifact@v4
        with:
          name: deepsea
          path: |
            build/libs/*.jar
            !build/libs/*-sources.jar

      - name: Publish release (on tag)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            build/libs/*.jar
            !build/libs/*-sources.jar
